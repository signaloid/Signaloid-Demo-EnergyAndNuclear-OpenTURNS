MinimumCore:
      Class: C0Pro
      Microarchitecture: Jupiter
      CorrelationTracking: Disable
      MemorySize: 256000
      Precision: 64

TraceVariables:
    - File: "main.c"
      LineNumber: 62
      Expression: "outputVariables[0:6]"

BenchmarkingVariables:
    - VariableName: outputVariables[0]
      VariableDescription: Transmission-line power (V*I + R*I^2)
      OutputObject: Distribution
      CommandLineArguments: -S 0
    - VariableName: outputVariables[1]
      VariableDescription: Total decay heat (Qshort + Qlong)
      OutputObject: Distribution
      CommandLineArguments: -S 1
    - VariableName: outputVariables[2]
      VariableDescription: Neutron reaction rate (Phi*Sigma)
      OutputObject: Distribution
      CommandLineArguments: -S 2
    - VariableName: outputVariables[3]
      VariableDescription: DNBR safety margin (qcrit/qlocal)
      OutputObject: Distribution
      CommandLineArguments: -S 3
    - VariableName: outputVariables[4]
      VariableDescription: Grid power (G*A + S*sin(phase) + k*G^2)
      OutputObject: Distribution
      CommandLineArguments: -S 4
    - VariableName: outputVariables[5]
      VariableDescription: Flood overflow (Zv + H - Zb - Hd)
      OutputObject: Distribution
      CommandLineArguments: -S 5
    - VariableName: outputVariables[6]
      VariableDescription: Fission gas release (fd*xdiff + fc*xcrack)
      OutputObject: Distribution
      CommandLineArguments: -S 6

BenchmarkingAllOutputs:
    - CommandLineArguments: -S 7
